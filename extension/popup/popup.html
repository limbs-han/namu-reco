<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>나무위키 추천</h1>
<p id="empty" hidden>아직 추천이 없어요 — 나무위키를 둘러보면 몇 분 안에 채워집니다</p>
<!-- [G1·B3] 번호 목록 → 출처별 섹션 + 아이콘 행 (드롭다운과 시각 언어 통일) -->
<div id="list"></div>
<!-- [G3] 뮤트 해제 UI — 관심 없음 처리한 주제 목록, 해제 시 즉시 재계산 -->
<details id="muted" hidden><summary>관심 없음 처리한 주제</summary><ul id="muted-rows"></ul></details>
<!-- [§7] 검증 편의 — dwell 계열은 자동화 불가(isTrusted), 사람 실측의 관측창 -->
<details id="debug"><summary>디버그 — 문서별 누적 dwell</summary><ol id="debug-rows"></ol></details>
<!-- [J2] docUrlOf는 common.js 단일 진실원 — popup도 앞서 로드 -->
<script src="../common.js"></script>
<script src="../db.js"></script>
<script src="popup.js"></script>
</body>
</html>
